<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monthly Budget</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budget">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eef1f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10151b" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one narrow column. Summary (with Day/Week/Month switch) first, then tabbed sections edited in place. */
:root {
  --bg: #eef1f5;
  --surface: #ffffff;
  --ink: #18212b;
  --muted: #5b6878;
  --line: #d5dce5;
  --accent: #3a6ea5;
  --accent-soft: #e1eaf4;
  --good: #1d7a4a;
  --good-soft: #e3f3e9;
  --bad: #b3261e;
  --bad-soft: #fbe9e7;
  --c-need: #2c4a6b;
  --c-want: #d08a1e;
  --c-debt: #c2504a;
  --c-save: #2e8b7a;
  --c-free: #a9b6c6;
  --c-auto: #6a55b8;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10151b; --surface: #18202a; --ink: #e3e9f0; --muted: #94a2b3; --line: #293442;
    --accent: #7fb0de; --accent-soft: #1c2a3a; --good: #5fcf8f; --good-soft: #17301f; --bad: #f08a80; --bad-soft: #3a1f1d;
    --c-need: #a9bfd6; --c-want: #e8a94a; --c-debt: #e47b74; --c-save: #5cc3b0; --c-free: #4a5868; --c-auto: #a594e8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10151b; --surface: #18202a; --ink: #e3e9f0; --muted: #94a2b3; --line: #293442;
  --accent: #7fb0de; --accent-soft: #1c2a3a; --good: #5fcf8f; --good-soft: #17301f; --bad: #f08a80; --bad-soft: #3a1f1d;
  --c-need: #a9bfd6; --c-want: #e8a94a; --c-debt: #e47b74; --c-save: #5cc3b0; --c-free: #4a5868; --c-auto: #a594e8;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--body); }
.wrap { max-width: 660px; margin: 0 auto; padding: calc(20px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); display: grid; gap: 16px; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; }
h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 17px; font-weight: 700; }
h3 { font-size: 15px; font-weight: 700; }
.num { font-variant-numeric: tabular-nums; }
header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.status { font-size: 12px; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 14px; min-width: 0; }
.banner { background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; font-size: 14px; }
.hero { display: grid; gap: 4px; }
.label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; }
.big { font-family: var(--display); font-size: 46px; font-weight: 700; line-height: 1.05; }
.big.neg { color: var(--bad); }
.sub { color: var(--muted); font-size: 14px; }
.meter { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.meter span { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.meter.over span { background: var(--bad); }
.bar { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--line); }
.bar span { display: block; height: 100%; }
.legend { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 16px; font-size: 14px; }
.legend div { display: flex; align-items: center; gap: 8px; min-width: 0; }
.legend i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.legend .v { margin-left: auto; font-variant-numeric: tabular-nums; white-space: nowrap; }
.seg { display: inline-flex; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; justify-self: start; }
.seg button { border: 0; background: transparent; color: var(--muted); font: 600 14px var(--body); padding: 6px 16px; border-radius: 7px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.planhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; border-top: 1px solid var(--line); padding-top: 14px; flex-wrap: wrap; }
.autoline { display: flex; align-items: center; gap: 10px; font-size: 14px; background: var(--bg); border-radius: 10px; padding: 10px 12px; }
.autoline i { width: 10px; height: 10px; border-radius: 50%; background: var(--c-auto); flex: none; }
.autoline .v { margin-left: auto; font-weight: 600; white-space: nowrap; }
.save-row { display: grid; gap: 6px; }
.save-row .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
input[type=range] { width: 100%; accent-color: var(--accent); }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; cursor: pointer; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.pill.ok { background: var(--good-soft); color: var(--good); }
.pill.no { background: var(--bad-soft); color: var(--bad); }
.pill.auto { background: var(--bg); color: var(--c-auto); border: 1px solid var(--line); }
.pill.need { color: var(--c-need); background: var(--bg); border: 1px solid var(--line); }
.pill.want { color: var(--c-want); background: var(--bg); border: 1px solid var(--line); }
.cardline { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14px; border-top: 1px solid var(--line); padding-top: 12px; }
.warn { background: var(--bad-soft); color: var(--bad); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
.okbox { background: var(--good-soft); color: var(--good); border-radius: 10px; padding: 10px 12px; font-size: 14px; }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; gap: 4px; justify-content: center; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); }
.tabs button { flex: 1 1 0; max-width: 130px; min-height: 46px; border: 0; background: transparent; color: var(--muted); font: 600 13px var(--body); padding: 6px 4px; border-radius: 10px; cursor: pointer; white-space: nowrap; }
.tabs button[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); }
.btn { min-height: 44px; }
.pick { display: flex; flex-wrap: wrap; gap: 6px; }
.opt { border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 500 14px var(--body); padding: 8px 13px; border-radius: 999px; min-height: 40px; cursor: pointer; }
.opt[aria-pressed="true"] { background: var(--accent); color: var(--surface); border-color: var(--accent); }
input[data-num] { cursor: pointer; }
input.kp-active { outline: 2px solid var(--accent); outline-offset: 1px; }
body.kp-open .wrap { padding-bottom: 400px; }
.kp { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -8px 28px rgba(0,0,0,.2); border-radius: 18px 18px 0 0; padding: 14px 12px calc(12px + env(safe-area-inset-bottom)); display: grid; gap: 10px; }
.kp > * { width: 100%; max-width: 460px; margin: 0 auto; }
.kp-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 0 4px; }
.kp-val { font-family: var(--display); font-size: 32px; font-weight: 700; }
.kp-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.kp-grid button { height: 56px; border: 0; border-radius: 12px; background: var(--bg); color: var(--ink); font: 500 24px var(--display); cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.kp-grid button:active { background: var(--line); }
.kp-grid .fn { font: 600 15px var(--body); color: var(--muted); }
.kp-grid .done { grid-row: span 2; height: auto; background: var(--accent); color: var(--surface); font: 600 16px var(--body); }

.list { display: grid; gap: 10px; }
.group-title { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-top: 4px; }
.row { display: grid; gap: 8px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; border-left: 4px solid var(--rowc, var(--line)); min-width: 0; }
.fields { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 8px; }
.fields.even { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.fields.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.meta-l { display: flex; gap: 12px; flex-wrap: wrap; flex: 1; justify-content: space-between; align-items: center; min-width: 0; }
.meta b { color: var(--ink); font-weight: 600; }
.meta .bad, .bad { color: var(--bad); }
.field { display: grid; gap: 3px; min-width: 0; }
.field > span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
input[type=text], input[type=number], input[type=date], select {
  width: 100%; min-width: 0; min-height: 42px; font: 16px var(--body); color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 9px;
}
input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.prefix { position: relative; }
.prefix::before { content: attr(data-p); position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.prefix.dollar input { padding-left: 20px; }
.prefix.pct::before, .prefix.mo::before { left: auto; right: 9px; }
.prefix.pct input { padding-right: 24px; }
.prefix.mo input { padding-right: 34px; }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 600 14px var(--body); padding: 9px 14px; border-radius: 10px; cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.btn.link { border: 0; background: transparent; color: var(--muted); padding: 4px 6px; font-weight: 500; }
.btn.link:hover { color: var(--bad); }
.note { font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 14px; padding: 4px 2px; }
.chips { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.chip { background: var(--bg); border-radius: 10px; padding: 10px; display: grid; gap: 2px; }
.chip b { font-size: 18px; font-family: var(--display); }
.chip span { font-size: 12px; color: var(--muted); }
.quick { display: grid; gap: 8px; background: var(--bg); border-radius: 12px; padding: 12px; }
.quick .fields { grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); }
.quick input, .quick select { background: var(--surface); }
.log { display: grid; }
.log-item { display: grid; grid-template-columns: 54px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.log-item:last-child { border-bottom: 0; }
.log-item .d { color: var(--muted); font-size: 13px; }
.log-item .w { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.log-item .w small { color: var(--muted); }
.kv { display: grid; gap: 6px; font-size: 14px; }
.kv div { display: flex; justify-content: space-between; gap: 10px; }
.kv .tot { border-top: 1px solid var(--line); padding-top: 6px; font-weight: 600; }
@media (max-width: 440px) {
  .big { font-size: 40px; }
  .legend { grid-template-columns: minmax(0, 1fr); }
  .fields.three { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .chips { grid-template-columns: minmax(0, 1fr); }
  .quick .fields { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: no-preference) { .bar span, .meter span { transition: width .25s ease; } .chev { transition: transform .15s; } }
/* Compact layout: rows are one line until tapped open. */
body { font-size: 14px; }
.wrap { gap: 10px; }
h1 { font-size: 21px; } h2 { font-size: 15px; } h3 { font-size: 14px; }
.card { padding: 12px; gap: 10px; border-radius: 12px; }
.big { font-size: 36px; }
.sub { font-size: 13px; }
.legend { font-size: 13px; gap: 3px 14px; }
.autoline { padding: 7px 10px; font-size: 13px; }
.planhead { padding-top: 10px; }
.seg button { padding: 5px 14px; font-size: 13px; }
.banner { padding: 8px 12px; font-size: 13px; }
.list { gap: 6px; }
.row { padding: 0; gap: 0; border-radius: 10px; border-left-width: 3px; scroll-margin-top: 10px; }
.row.open { padding-bottom: 10px; gap: 8px; background: var(--bg); }
.row.open > :not(.rowhead) { margin: 0 10px; }
.row.open input, .row.open select { background: var(--surface); }
.rowhead { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 42px; padding: 6px 10px; border: 0; background: transparent; color: var(--ink); font: 500 14px var(--body); text-align: left; cursor: pointer; border-radius: 10px; }
.rh { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; }
.rh-n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.rh-v { margin-left: auto; white-space: nowrap; font-weight: 600; }
.rh-v .sub { font-weight: 400; }
.chev { color: var(--muted); font-size: 11px; }
.row.open .chev { transform: rotate(180deg); }
.rowmeter { margin: -2px 10px 8px; height: 4px; }
.pill { font-size: 11px; padding: 1px 7px; }
input[type=text], input[type=number], input[type=date], select { min-height: 38px; padding: 6px 8px; }
input[type=date] { -webkit-appearance: none; appearance: none; display: block; max-width: 100%; min-width: 0; line-height: 24px; }
input[type=date]::-webkit-date-and-time-value { text-align: left; margin: 0; }
.field, .field > div, .fields, .quick { min-width: 0; max-width: 100%; }
.btn { min-height: 38px; padding: 7px 12px; font-size: 13px; }
textarea { width: 100%; min-height: 90px; font: 12px ui-monospace, Menlo, monospace; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
.sync { position: fixed; inset: 0; z-index: 15; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; }
.sync-in { max-width: 660px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom)); display: grid; gap: 12px; }
body.kp-open .sync-in { padding-bottom: 380px; }
body.sync-open { overflow: hidden; }
.sy-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-height: 42px; cursor: pointer; }
.sy-item input { width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
.sy-item .n { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sy-item .v { margin-left: auto; white-space: nowrap; color: var(--muted); }
.sy-amt { width: 108px; flex: none; margin-left: auto; }
.sy-amt input[type=text] { min-height: 34px; padding-top: 4px; padding-bottom: 4px; }
.sy-foot { position: sticky; bottom: 0; background: var(--bg); padding: 8px 0 4px; display: flex; gap: 8px; }
.sy-foot .btn { flex: 1; min-height: 46px; font-size: 15px; }
.syncline { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.syncline .btn { margin-left: auto; flex: none; }
details.exact { background: var(--bg); border-radius: 10px; padding: 8px 10px; }
details.exact summary { cursor: pointer; font-weight: 600; font-size: 13px; color: var(--muted); }
details.exact .kv { margin-top: 8px; font-size: 13px; }
details.exact .kv div span:first-child { min-width: 0; }
details.exact .kv div span:last-child { white-space: nowrap; }

.btn.del { color: var(--bad); border-color: var(--bad); background: transparent; min-height: 34px; padding: 4px 12px; }
.opt { min-height: 34px; padding: 5px 11px; font-size: 13px; }
.quick { padding: 10px; gap: 8px; scroll-margin-top: 10px; }
.chips { gap: 6px; } .chip { padding: 8px; } .chip b { font-size: 16px; }
.log-item { padding: 5px 0; font-size: 13px; grid-template-columns: 48px minmax(0, 1fr) auto auto; gap: 8px; }
.kp { padding-top: 10px; gap: 8px; }
.kp-grid { gap: 6px; } .kp-grid button { height: 50px; font-size: 22px; } .kp-val { font-size: 26px; }
body.kp-open .wrap { padding-bottom: 360px; }
.tabs button { min-height: 40px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Monthly Budget</h1>
    <div class="status" id="status" aria-live="polite">Loading…</div>
  </header>

  <div class="banner" id="exampleBanner" hidden>
    <span>These are example numbers. Replace them with yours, or start from a blank budget.</span>
    <button class="btn" id="clearExamples" type="button">Start blank</button>
  </div>

  <section class="card" aria-labelledby="heroLabel">
    <div class="seg" role="group" aria-label="View" id="viewSeg">
      <button type="button" data-view="day">Day</button>
      <button type="button" data-view="week">Week</button>
      <button type="button" data-view="month">Month</button>
    </div>
    <div class="hero">
      <div class="label" id="heroLabel"></div>
      <div class="big num" id="heroNum">$0</div>
      <div class="sub num" id="heroSub"></div>
    </div>
    <div class="meter" id="heroMeter"><span></span></div>
    <div id="exactBox"></div>

    <div class="planhead"><h2 id="planTitle">Your plan</h2><span class="sub num" id="planIncome"></span></div>
    <div class="bar" id="bar" aria-hidden="true"></div>
    <div class="legend num" id="legend"></div>
    <div class="autoline num" id="autoLine"></div>

    <div class="save-row">
      <div class="top">
        <label for="savePct" class="label">Save of income</label>
        <span class="num"><b id="savePctOut">10%</b> · <span id="saveAmt"></span></span>
      </div>
      <input type="range" id="savePct" min="0" max="50" step="1" value="10">
      <label class="check"><input type="checkbox" id="saveAuto"> Savings transfer is automatic</label>
    </div>
    <div class="warn" id="overWarn" hidden></div>
    <div class="cardline num" id="cardLine"></div>
  </section>

  <nav class="tabs" role="tablist" id="tabs"></nav>
  <section class="card" id="panel" role="tabpanel"></section>
</div>

<div class="sync" id="sync" role="dialog" aria-modal="true" aria-label="Re-sync balances" hidden><div class="sync-in" id="syncBody"></div></div>

<div class="kp" id="kp" role="dialog" aria-label="Number pad" hidden>
  <div class="kp-head"><span class="label" id="kpLabel"></span><span class="kp-val num" id="kpVal"></span></div>
  <div class="kp-grid">
    <button type="button" data-key="1">1</button><button type="button" data-key="2">2</button><button type="button" data-key="3">3</button><button type="button" class="fn" data-key="back" aria-label="Delete last digit">⌫</button>
    <button type="button" data-key="4">4</button><button type="button" data-key="5">5</button><button type="button" data-key="6">6</button><button type="button" class="fn" data-key="clear">Clear</button>
    <button type="button" data-key="7">7</button><button type="button" data-key="8">8</button><button type="button" data-key="9">9</button><button type="button" class="done" data-key="done">Done</button>
    <button type="button" data-key=".">.</button><button type="button" data-key="0">0</button><button type="button" data-key="00">00</button>
  </div>
</div>

<script>
(() => {
  // ================= helpers =================
  const FREQ = {
    weekly:    { label: "Weekly",         perMonth: 52 / 12 },
    biweekly:  { label: "Every 2 weeks",  perMonth: 26 / 12 },
    monthly:   { label: "Monthly",        perMonth: 1 },
    quarterly: { label: "Every 3 months", perMonth: 1 / 3 },
    semi:      { label: "Every 6 months", perMonth: 1 / 6 },
    yearly:    { label: "Yearly",         perMonth: 1 / 12 },
  };
  const SCALE = { day: 12 / 365, week: 12 / 52, month: 1 };
  const n = v => { const x = parseFloat(v); return isFinite(x) ? x : 0; };
  const monthly = it => n(it.amount) * (FREQ[it.freq] ? FREQ[it.freq].perMonth : 1);

  function compute() {

        : line(`${esc(state.card.name || "Credit card")} to pay off in full${x.stmtKnown ? ` (${money(x.cardDueNow)} due by ${shortDate(x.endY)}, ${money(x.cardNext)} next month)` : ""}`, x.cardOwed, "−")}
      ${line("Cushion to keep in the bank", x.cushion, "−")}
      <div class="tot"><span>Left until ${shortDate(x.endY)}</span><span class="${x.avail < 0 ? "bad" : ""}">${signed(Math.round(x.avail * 100) / 100)}</span></div>
    </div><div class="note">Bills not yet paid are already taken off above. Counting autopay and paydays up to today, your bank should show about <b>${money(Math.round(x.expectedBank * 100) / 100)}</b> (before any card payment). If it doesn't, re-sync.</div>${x.cFresh ? "" : `<div class="note">Your card balance isn't entered, so only card purchases logged here are counted. Tap Re-sync to add it.</div>`}</details>${syncLine()}`;
  }
  let exactOpen = true;
  document.addEventListener("toggle", e => { if (e.target.matches && e.target.matches("details.exact")) exactOpen = e.target.open; }, true);

  // ================= tabs =================
  const TABS = [
    { key: "spend", label: "Spend" },
    { key: "bills", label: "Bills" },
    { key: "income", label: "Income" },
    { key: "card", label: "Card" },
    { key: "debt", label: "Debt" },
  ];
  function renderTabs() {
    $("tabs").innerHTML = TABS.map(x =>
      `<button type="button" role="tab" id="tab-${x.key}" data-tab="${x.key}" aria-selected="${x.key === tab}" aria-controls="panel">${x.label}</button>`).join("");
  }

  // ---------- field builders ----------
  const moneyField = (list, it, k, label) => `<label class="field"><span>${label}</span><div class="prefix dollar" data-p="$"><input type="number" inputmode="decimal" min="0" step="0.01" data-k="${k}" id="${list}-${k}-${it.id}" value="${esc(it[k])}"></div></label>`;
  const textField = (list, it, label, ph) => `<label class="field"><span>${label}</span><input type="text" data-k="name" id="${list}-name-${it.id}" value="${esc(it.name)}" placeholder="${ph}"></label>`;
  const selectField = (list, it, k, label, opts) => `<label class="field"><span>${label}</span><select data-k="${k}" id="${list}-${k}-${it.id}">${opts.map(([v, l]) => `<option value="${v}"${String(it[k]) === v ? " selected" : ""}>${l}</option>`).join("")}</select></label>`;
  const freqOpts = keys => keys.map(k => [k, FREQ[k].label]);
  const KIND = [["need", "Need"], ["want", "Want / luxury"]];
  const removeBtn = (list, it) => `<button type="button" class="btn del" data-del="${it.id}" data-list="${list}" aria-label="Delete ${esc(it.name) || "item"}">Delete</button>`;
  const openRows = new Set();
  // In exact mode, says whether a bill or loan payment is still counted against this month's money.
  // Where a bill or loan payment stands this month, relative to the last re-sync and today.
  //   in     = already included in the balances entered at re-sync
  //   auto   = set aside, and its autopay date has now passed (it has left the account since)
  //   late   = set aside, paid by hand, and its due date has passed
  //   coming = set aside, date not reached yet (or no date)
  function billStatus(it, t, asDebt) {
    const x = t.exact; if (!x) return null;
    const e = asDebt ? { amount: it.payment, due: it.due, paid: it.paid, unpaid: it.unpaid } : it;
    if (dueLeft(e, !asDebt && it.pay === "card" ? x.cDay : x.sDay, t.monthS, t.dim) <= 0) return { code: "in" };
    const d = (!e.freq || e.freq === "monthly") ? Math.min(parseInt(e.due, 10) || 0, t.dim) : 0, day = t.today.getDate();
    if (d && it.auto && d <= day) return { code: "auto", d };
    if (d && !it.auto && d < day) return { code: "late", d };
    return { code: "coming", d };
  }
  function stillPill(it, t, asDebt) {
    const b = billStatus(it, t, asDebt); if (!b) return "";
    if (b.code === "in") return '<span class="pill ok">Paid</span>';
    if (b.code === "auto") return `<span class="pill ok">Auto-paid on the ${ordinal(b.d)}</span>`;
    if (b.code === "late") return `<span class="pill no">Was due on the ${ordinal(b.d)}</span>`;
    return `<span class="pill need">Set aside${b.d ? ", due " + ordinal(b.d) : ""}</span>`;
  }
  function headPill(it, t, asDebt) {
    const b = billStatus(it, t, asDebt); if (!b) return "";
    return b.code === "coming" ? '<span class="pill need">Due</span>' : b.code === "late" ? '<span class="pill no">Past due?</span>' : "";
  }
  const paidBox = (list, it, t) => `<label class="check"><input type="checkbox" data-k="paid" id="${list}-paid-${it.id}"${it.paid === t.monthS ? " checked" : ""}> Already paid this month</label>`;
  const catSpent = (it, t) => t.monthLog.filter(e => e.cat === it.id).reduce((a, e) => a + n(e.amount), 0);
  function head(list, it, t) {
    const name = `<span class="rh-n">${esc(it.name || "Unnamed")}</span>`;
    if (list === "income") return `${name}<span class="rh-v num">${money(monthly(it))}/mo</span>`;
    if (list === "expenses") return `${name}${it.auto ? '<span class="pill auto">Auto</span>' : ""}${it.pay === "card" ? '<span class="pill need">Card</span>' : ""}${headPill(it, t)}<span class="rh-v num">${it.varies ? "about " : ""}${money(monthly(it))}/mo</span>`;
    if (list === "budgets") { const sp = catSpent(it, t), lim = n(it.amount); return `${name}<span class="rh-v num${sp > lim ? " bad" : ""}">${money(sp)} <span class="sub">of ${moneyR(lim)}</span></span>`; }
    return `${name}<span class="rh-v num">${moneyR(n(it.balance))} <span class="sub">${money(n(it.payment))}/mo</span></span>`;
  }

  // ---------- row meta (live-updated) ----------
  function meta(list, it, t) {
    if (list === "income") {
      const ds = t.exact ? paydaysBetween(it, ymd(new Date(t.exact.bankAt)), t.exact.endY) : null;
      const left = !it.next ? '<span class="bad">Set your next payday for exact numbers</span>' : ds ? `<span>${ds.length ? "Still to come: " + ds.map(shortDate).join(", ") : "No more paydays this month"}</span>` : "<span></span>";
      return `${left}<span><b>${money(monthly(it))}</b> a month</span>`;
    }
    if (list === "expenses") {
      const tags = `<span style="display:flex;gap:6px;flex-wrap:wrap">${it.auto ? '<span class="pill auto">Automatic</span>' : ""}<span class="pill ${it.kind === "want" ? "want" : "need"}">${it.kind === "want" ? "Want" : "Need"}</span>${it.due ? `<span>Due ${ordinal(it.due)}</span>` : ""}${stillPill(it, t)}</span>`;
      return `${tags}<span><b>${money(monthly(it))}</b>/mo</span>`;
    }
    if (list === "budgets") {
      const spent = t.monthLog.filter(e => e.cat === it.id).reduce((a, e) => a + n(e.amount), 0);
      const lim = n(it.amount); const over = spent > lim;
      return `<span style="flex:1 1 100%"><div class="meter${over ? " over" : ""}"><span style="width:${lim > 0 ? Math.min(spent / lim, 1) * 100 : (spent ? 100 : 0)}%"></span></div></span>
        <span class="${over ? "bad" : ""}">Spent <b>${money(spent)}</b> of ${moneyR(lim)} this month</span><span>${money(lim * 12 / 365)}/day</span>`;
    }
    if (list === "debts") {
      const p = payoff(it);
      if (n(it.balance) <= 0) return `<span>Paid off</span>`;
      if (p.never) return `<span class="bad">Payment must be over ${money(p.minNeeded)} just to cover interest</span>`;
      const d = new Date(); d.setMonth(d.getMonth() + p.months);
      return `<span>Paid off in <b>${p.months} mo</b> (${monthName(d)})</span><span>Interest: <b>${moneyR(p.interest)}</b></span>${stillPill(it, t, true)}`;
    }
    return "";
  }
  const COLORS = { income: "var(--good)", budgets: null, expenses: null, debts: "var(--c-debt)" };
  function row(list, it, fields, t) {
    const c = COLORS[list] || (it.kind === "want" ? "var(--c-want)" : "var(--c-need)");
    const open = openRows.has(it.id);
    let slim = "";
    if (!open && list === "budgets") { const sp = catSpent(it, t), lim = n(it.amount); slim = `<div class="meter rowmeter${sp > lim ? " over" : ""}"><span style="width:${lim > 0 ? Math.min(sp / lim, 1) * 100 : (sp ? 100 : 0)}%"></span></div>`; }
    return `<div class="row${open ? " open" : ""}" data-list="${list}" data-id="${it.id}" style="--rowc:${c}">
      <button type="button" class="rowhead" data-toggle="${it.id}" aria-expanded="${open}"><span class="rh">${head(list, it, t)}</span><span class="chev" aria-hidden="true">▼</span></button>
      ${open ? `${fields}<div class="meta"><div class="meta-l">${meta(list, it, t)}</div>${removeBtn(list, it)}</div>` : slim}</div>`;
  }

  // ---------- panels ----------
  function panelSpend(t) {
    const cats = state.budgets;
    if (q.cat !== "" && !cats.some(c => c.id === q.cat)) q.cat = cats.length ? cats[0].id : "";
    const recent = [...t.monthLog].sort((a, b) => (b.date + b.id).localeCompare(a.date + a.id));
    const catName = id => (cats.find(c => c.id === id) || {}).name || "Other";
    const fmtD = s => parseYmd(s).toLocaleDateString("en-US", { month: "short", day: "numeric" });
    const unassigned = Math.max(t.left, 0);
    return `
      <form class="quick" id="quickForm" autocomplete="off">
        <h3>Add a purchase</h3>
        <div class="fields even">
          <label class="field"><span>Amount</span><div class="prefix dollar" data-p="$"><input type="number" id="qAmount" placeholder="Tap to enter"></div></label>
          <label class="field"><span>Date</span><input type="date" id="qDate" value="${t.todayS}"></label>
        </div>
        <div class="field"><span>Category</span><div class="pick">${cats.map(c => `<button type="button" class="opt" data-q="cat" data-v="${esc(c.id)}" aria-pressed="${q.cat === c.id}">${esc(c.name || "Unnamed")}</button>`).join("")}<button type="button" class="opt" data-q="cat" data-v="" aria-pressed="${q.cat === ""}">Other</button></div></div>
        <div class="field"><span>Paid with</span><div class="pick">${[["card", state.card.name || "Credit card"], ["bank", "Debit"], ["cash", "Cash"]].map(([v, l]) => `<button type="button" class="opt" data-q="method" data-v="${v}" aria-pressed="${q.method === v}">${esc(l)}</button>`).join("")}</div></div>
        <label class="field"><span>Note (optional)</span><input type="text" id="qNote" placeholder="e.g. Aldi"></label>
        <div><button class="btn primary" type="submit">Add purchase</button></div>
      </form>

      <div class="group-title"><h3>Everyday spending limits</h3><span class="sub num">${moneyR(t.flex)}/mo</span></div>
      <div class="list">${cats.length ? cats.map(c => row("budgets", c, `<div class="fields">${textField("budgets", c, "Category", "e.g. Groceries")}${moneyField("budgets", c, "amount", "Monthly limit")}</div>
        <div class="fields even">${selectField("budgets", c, "kind", "Type", KIND)}</div>`, t)).join("") : '<div class="empty">No categories yet.</div>'}</div>
      <div><button type="button" class="btn" data-add="budgets">Add category</button></div>
      <div class="note">Tap a category to edit or delete it. ${t.exact ? "Your daily amount is what's left until the end of the month, spread over the days left." : `Your daily amount is your category limits${unassigned > 0 ? ` plus ${moneyR(unassigned)} you haven't assigned` : ""}, minus what you've spent this month, spread over the days left.`}</div>

      <div class="group-title"><h3>This month's purchases</h3><span class="sub num">${money(t.spentMonth)}</span></div>
      <div class="log">${recent.length ? recent.map(e => `<div class="log-item num">
          <span class="d">${fmtD(e.date)}</span>
          <span class="w">${esc(e.note || catName(e.cat))} <small>· ${esc(catName(e.cat))} · ${e.method === "card" ? "Card" : e.method === "cash" ? "Cash" : "Debit"}</small></span>
          <b>${money(n(e.amount))}</b>
          <button type="button" class="btn del" data-dellog="${e.id}" aria-label="Delete purchase">Delete</button></div>`).join("") : '<div class="empty">Nothing logged this month yet.</div>'}</div>`;
  }

  function chipsHTML(t) {
    return `<div class="chip"><span>Automatic</span><b class="num">${moneyR(t.autoTotal)}</b><span>leaves on its own</span></div>
      <div class="chip"><span>Needs</span><b class="num" style="color:var(--c-need)">${moneyR(t.needs)}</b><span>bills + essentials</span></div>
      <div class="chip"><span>Wants</span><b class="num" style="color:var(--c-want)">${moneyR(t.wants)}</b><span>you could cut these</span></div>`;
  }
  function panelBills(t) {
    const exRow = e => row("expenses", e, `<div class="fields">${textField("expenses", e, "Bill or subscription", "e.g. Rent")}${moneyField("expenses", e, "amount", "Amount")}</div>
      <div class="fields even">${selectField("expenses", e, "freq", "How often", freqOpts(["monthly", "weekly", "biweekly", "quarterly", "semi", "yearly"]))}
      <label class="field"><span>Due day</span><input type="number" inputmode="numeric" min="1" max="31" data-k="due" id="expenses-due-${e.id}" value="${esc(e.due)}" placeholder="1–31"></label></div>
      <div class="fields even">${selectField("expenses", e, "kind", "Type", KIND)}${selectField("expenses", e, "pay", "Paid from", [["bank", "Bank account"], ["card", state.card.name || "Credit card"]])}</div>
      <label class="check"><input type="checkbox" data-k="auto" id="expenses-auto-${e.id}"${e.auto ? " checked" : ""}> Comes out automatically</label>
      <label class="check"><input type="checkbox" data-k="varies" id="expenses-varies-${e.id}"${e.varies ? " checked" : ""}> Amount changes each month (this is an estimate)</label>`, t);
    const auto = state.expenses.filter(e => e.auto), manual = state.expenses.filter(e => !e.auto);
    const sumM = a => moneyR(a.reduce((s, e) => s + monthly(e), 0));
    return `<div class="chips" id="chips">${chipsHTML(t)}</div>
      <div class="group-title"><h3>Automatic</h3><span class="sub num">${sumM(auto)}/mo</span></div>
      <div class="list">${auto.length ? auto.map(exRow).join("") : '<div class="empty">Nothing set to come out automatically.</div>'}</div>
      <div class="group-title"><h3>Paid by you</h3><span class="sub num">${sumM(manual)}/mo</span></div>
      <div class="list">${manual.length ? manual.map(exRow).join("") : '<div class="empty">Nothing here.</div>'}</div>
      <div class="field"><span>Tap to add a common one</span><div class="pick">${PRESETS.map((p, i) => `<button type="button" class="opt" data-preset="${i}">${p[0]}</button>`).join("")}</div></div>
      <div><button type="button" class="btn" data-add="expenses">Add something else</button></div>
      <div class="note">Tap an item to edit or delete it. Mark anything that's a choice as a want. Bills that come every few months are spread across each month so you set money aside. Debt payments are on the Debt tab.</div>`;
  }

  function panelIncome(t) {
    return `${syncLine()}
      <div class="group-title"><h3>Income</h3><span class="sub num">${moneyR(t.income)}/mo</span></div>
      <div class="list">${state.income.map(i => row("income", i, `<div class="fields">${textField("income", i, "Source", "e.g. Paycheck")}${moneyField("income", i, "amount", "Amount")}</div>
      <div class="fields even">${selectField("income", i, "freq", "How often", freqOpts(["weekly", "biweekly", "monthly", "yearly"]))}
      <label class="field"><span>Next payday</span><input type="date" data-k="next" id="income-next-${i.id}" value="${esc(i.next || "")}"></label></div>`, t)).join("") || '<div class="empty">No income yet.</div>'}</div>
      <div><button type="button" class="btn primary" data-add="income">Add income</button></div>
      <div class="note">Use take-home pay, after taxes and anything your employer deducts. Set the next payday so the app knows how many paychecks are still to come this month.</div>
      <div class="group-title" style="border-top:1px solid var(--line);padding-top:12px"><h3>Backup</h3></div>
      <div class="note">Your budget is stored only in this app on this device. Copy a backup now and then and keep it in Notes, so you can restore it if the data is ever cleared or you move to a new phone.</div>
      <div class="btnrow"><button type="button" class="btn" id="bkCopy">Copy backup</button><button type="button" class="btn" id="bkShow">Restore from a backup</button></div>
      <div id="bkBox" class="list" hidden>
        <textarea id="bkText" aria-label="Backup text" placeholder="Paste your backup here"></textarea>
        <div class="btnrow"><button type="button" class="btn del" id="bkRestore">Replace my budget with this backup</button></div>
      </div>
      <div class="note" id="bkMsg" aria-live="polite"></div>`;
  }

  function cardHTML(t) {
    const lim = n(state.card.limit), x = t.exact;
    const due = state.card.dueDay ? ` by the ${ordinal(state.card.dueDay)}` : "";
    const util = owed => lim > 0 ? `<div class="field"><span>Credit used: ${money(owed)} of ${moneyR(lim)} (${Math.round(owed / lim * 100)}%)</span><div class="meter${owed > lim * 0.3 ? " over" : ""}"><span style="width:${Math.min(owed / lim, 1) * 100}%"></span></div></div>` : "";
    if (x) {
      const short = -(x.avail + x.cushion), ok = short <= 0, end = shortDate(x.endY);
      const what = x.stmtOnly ? `the ${money(x.cardDueNow)} due by ${end}` : `the full ${money(x.cardOwed)}`;
      return `<div class="${ok ? "okbox" : "warn"}">${ok
          ? `You can pay ${what}. After that you'd still have <b>${moneyR(Math.max(x.avail, 0))}</b> to spend this month.`
          : `You're ${moneyR(short)} short of paying ${what}. Cut spending or move a bill to get back under.`}</div>
        <div class="kv num">
          ${x.stmtKnown ? `<div class="tot" style="border-top:0;padding-top:0"><span>Due by ${end} (last statement)</span><span>${money(x.cardDueNow)}</span></div>
          <div><span>New charges so far this month</span><span>${money(x.cardNow - x.cardDueNow)}</span></div>`
          : `<div><span>Card balance${x.cFresh ? " at re-sync" : " (not entered)"}</span><span>${money(x.cardNow)}</span></div>`}
          <div><span>Card purchases logged since re-sync</span><span>${money(x.cardSince)}</span></div>
          <div><span>Card bills still to be charged</span><span>${money(x.cardBills)}</span></div>
          ${x.stmtKnown ? `<div class="tot"><span>On next month's bill</span><span>${money(x.cardNext)}</span></div>` : ""}
          <div class="tot"><span>Total on the card by month end</span><span>${money(x.cardOwed)}</span></div>
          <div><span>Bank money available for it</span><span>${signed(Math.round(x.beforeCard * 100) / 100)}</span></div>
        </div>${util(x.cardOwed)}
        ${x.stmtKnown ? "" : `<div class="note">To split this into what's due this month and next month, re-sync and enter the amount due this month.</div>`}`;
    }
    const ok = t.cardTotal <= t.capacity;
    return `<div class="${ok ? "okbox" : "warn"}">${ok
        ? `Estimate from your monthly plan: you can pay this month's ${money(t.cardTotal)} in full${due}, with room for <b>${moneyR(t.cardRoom)}</b> more.`
        : `Estimate from your monthly plan: this month's card total is ${moneyR(t.cardTotal - t.capacity)} more than you'll have left to pay it.`}</div>
      <div class="kv num">
        <div><span>Recurring bills on the card</span><span>${money(t.cardFixed)}</span></div>
        <div><span>Purchases this month</span><span>${money(t.cardSpent)}</span></div>
        ${t.carried ? `<div><span>Card balance entered</span><span>${money(t.carried)}</span></div>` : ""}
        <div class="tot"><span>Card total this month</span><span>${money(t.cardTotal)}</span></div>
      </div>${util(t.cardTotal)}
      <div class="note">Enter your balances to make this exact.</div>`;
  }
  function panelCard(t) {
    const c = state.card;
    return `<div class="fields">
        <label class="field"><span>Card name</span><input type="text" data-path="card.name" id="cardName" value="${esc(c.name)}"></label>
        <label class="field"><span>Credit limit</span><div class="prefix dollar" data-p="$"><input type="number" inputmode="decimal" min="0" data-path="card.limit" id="cardLimit" value="${esc(c.limit)}"></div></label>
      </div>
      <div class="fields even">
        <label class="field"><span>Payment due day</span><input type="number" inputmode="numeric" min="1" max="31" data-path="card.dueDay" id="cardDue" value="${esc(c.dueDay)}" placeholder="1–31"></label>
        
      </div>
      <label class="field"><span>Take off my spending money this month</span><select data-path="card.mode" id="cardMode">
        <option value="full"${c.mode === "statement" ? "" : " selected"}>Everything on the card (stay fully paid up)</option>
        <option value="statement"${c.mode === "statement" ? " selected" : ""}>Only what's due this month</option></select></label>
      ${syncLine()}
      <div id="cardOut" class="card" style="padding:0;border:0">${cardHTML(t)}</div>
      <div class="note">Your card balance is set when you re-sync. Purchases you log with the card after that, and card bills still to be charged this month, are added on top.</div>`;
  }

  function calcHTML(t) {
    const c = state.calc;
    const P = n(c.amount), apr = n(c.apr), m = Math.round(n(c.months));
    const pay = loanPayment(P, apr, m);
    const room = Math.max(t.left, 0);
    const total = pay * m, interest = total - P;
    const newDebtPct = t.income > 0 ? (t.debt + pay) / t.income * 100 : 0;
    let verdict, cls;
    if (!(P > 0 && m > 0)) { verdict = "Enter an amount and a term."; cls = "note"; }
    else if (pay <= room * 0.5) { verdict = `Affordable. ${money(pay)}/mo uses ${Math.round(pay / (room || 1) * 100)}% of your ${moneyR(room)} unassigned money.`; cls = "okbox"; }
    else if (pay <= room) { verdict = `Tight. ${money(pay)}/mo would use ${Math.round(pay / room * 100)}% of your unassigned money, leaving ${moneyR(room - pay)} a month of cushion.`; cls = "warn"; }
    else { verdict = `Not affordable right now. ${money(pay)}/mo is ${moneyR(pay - room)} more than you have unassigned.${t.wants > 0 ? ` You'd need to cut wants (now ${moneyR(t.wants)}/mo) or lower your savings rate.` : ""}`; cls = "warn"; }
    const maxComfort = loanPrincipal(room * 0.5, apr, m), maxAll = loanPrincipal(room, apr, m);
    return `<div class="${cls}">${verdict}</div>
      ${P > 0 && m > 0 ? `<div class="kv num">
        <div><span>Monthly payment</span><span>${money(pay)}</span></div>
        <div><span>Total interest</span><span>${moneyR(interest)}</span></div>
        <div><span>All debt payments would be</span><span class="${newDebtPct > 20 ? "bad" : ""}">${Math.round(newDebtPct)}% of take-home</span></div>
        <div class="tot"><span>Comfortable max loan at this rate and term</span><span>${moneyR(maxComfort)}</span></div>
        <div><span>Absolute max (uses all unassigned money)</span><span>${moneyR(maxAll)}</span></div>
      </div>` : ""}`;
  }
  function panelDebt(t) {
    const c = state.calc;
    return `<div class="list">${state.debts.length ? [...state.debts].sort((a, b) => n(b.apr) - n(a.apr)).map(d => row("debts", d, `<div class="fields">${textField("debts", d, "Debt", "e.g. Car loan")}</div>
      <div class="fields three">${moneyField("debts", d, "balance", "Balance")}
      <label class="field"><span>Interest (APR)</span><div class="prefix pct" data-p="%"><input type="number" inputmode="decimal" min="0" step="0.01" data-k="apr" id="debts-apr-${d.id}" value="${esc(d.apr)}"></div></label>
      ${moneyField("debts", d, "payment", "Monthly payment")}</div>
      <div class="fields even"><label class="field"><span>Due day</span><input type="number" min="1" max="31" data-k="due" id="debts-due-${d.id}" value="${esc(d.due)}" placeholder="1–31"></label></div>
      <label class="check"><input type="checkbox" data-k="auto" id="debts-auto-${d.id}"${d.auto ? " checked" : ""}> Comes out automatically</label>`, t)).join("") : '<div class="empty">No loans. Your credit card is tracked on its own tab since you pay it in full.</div>'}</div>
      <div><button type="button" class="btn" data-add="debts">Add a loan</button></div>

      <div class="group-title" style="border-top:1px solid var(--line);padding-top:14px"><h3>Can I afford a new loan?</h3></div>
      <div class="fields three">
        <label class="field"><span>Loan amount</span><div class="prefix dollar" data-p="$"><input type="number" inputmode="decimal" min="0" data-path="calc.amount" id="calcAmt" value="${esc(c.amount)}"></div></label>
        <label class="field"><span>Interest (APR)</span><div class="prefix pct" data-p="%"><input type="number" inputmode="decimal" min="0" step="0.01" data-path="calc.apr" id="calcApr" value="${esc(c.apr)}"></div></label>
        <label class="field"><span>Term</span><div class="prefix mo" data-p="mo"><input type="number" inputmode="numeric" min="1" data-path="calc.months" id="calcMonths" value="${esc(c.months)}"></div></label>
      </div>
      <div id="calcOut" class="card" style="padding:0;border:0">${calcHTML(t)}</div>
      <div class="note">This checks the payment against money you haven't already planned for, after your savings. A common rule of thumb is to keep debt payments other than rent or a mortgage under about 10–20% of take-home pay. It's a planning aid, not financial advice.</div>`;
  }

  const numify = root => document.querySelectorAll(root + ' input[type="number"]').forEach(i => { i.type = "text"; i.dataset.num = "1"; i.readOnly = true; i.inputMode = "none"; });

  // ================= re-sync: the one place balances are set =================
  function openSync() {
    const t = compute(), day = t.today.getDate();
    const pre = e => { // autopay whose date has arrived starts ticked; so does anything ticked before
      const d = (!e.freq || e.freq === "monthly") ? parseInt(e.due, 10) || 0 : 0;
      if (e.paid === t.monthS) return true;
      if (d && e.auto && d <= day) return true;
      if (e.unpaid === t.monthS) return false;
      return d > 0 && d < day;
    };
    const item = (list, e, amt, tag) => `<label class="sy-item"><input type="checkbox" data-sy-paid="${list}:${e.id}" id="sy-${list}-${e.id}"${pre(e) ? " checked" : ""}><span class="n">${esc(e.name || "Unnamed")}</span>${tag}${e.varies
      ? `<span class="prefix dollar sy-amt" data-p="$"><input type="number" data-sy-amt="${e.id}" id="sy-amt-${e.id}" aria-label="${esc(e.name || "Bill")} amount this month" value="${esc(e.amount)}"></span>`
      : `<span class="v num">${money(amt)}${e.due ? " · " + ordinal(e.due) : ""}</span>`}</label>`;
    const bank = state.expenses.filter(e => e.pay !== "card"), card = state.expenses.filter(e => e.pay === "card");
    const items = [...bank.map(e => item("expenses", e, n(e.amount), "")), ...state.debts.map(d => item("debts", d, n(d.payment), "")), ...card.map(e => item("expenses", e, n(e.amount), '<span class="pill need">Card</span>'))];
    $("syncBody").innerHTML = `
      <h1>Re-sync</h1>
      <div class="sub">Open your banking app and enter what it shows right now. Everything is recalculated from these numbers.</div>
      <div class="quick">
        <div class="fields even">
          <label class="field"><span>In your bank now</span><div class="prefix dollar" data-p="$"><input type="number" id="syBank" value="${esc(state.balance)}" placeholder="Tap to enter"></div></label>
        </div>
        <div class="fields even">
          <label class="field"><span>Card: total balance</span><div class="prefix dollar" data-p="$"><input type="number" id="syCard" value="${esc(state.card.balance)}" placeholder="0"></div></label>
          <label class="field"><span>Card: due this month</span><div class="prefix dollar" data-p="$"><input type="number" id="syStmt" value="${esc(state.card.statement === undefined ? "" : state.card.statement)}" placeholder="Optional"></div></label>
        </div>
        <div class="note">On Apple Card, the total is "Card Balance" in Wallet and the amount due this month is "Monthly Balance" (tap the Pay button to see it). Enter what's still unpaid of each.</div>
        </div>
      </div>
      ${state.income.length ? `<div class="quick"><h3>Next payday</h3>${state.income.map(i => `<label class="field"><span>${esc(i.name || "Income")} · ${money(n(i.amount))}</span><input type="date" data-sy-next="${i.id}" id="sy-next-${i.id}" value="${esc(i.next || "")}"></label>`).join("")}
        <div class="note">A paycheck already in your bank balance shouldn't be counted again, so pick the next one you haven't received.</div></div>` : ""}
      ${items.length ? `<div class="list"><h3>Tick what has already come out this month</h3>
        <div class="note">Ticked items are treated as already included in the balances above. Unticked ones are still to come and get set aside.${state.expenses.some(e => e.varies) ? " For bills that change, tap the amount to put in this month's figure once you know it. Until then the last amount is used as the estimate." : ""}</div>${items.join("")}</div>` : ""}
      <div class="quick"><label class="field"><span>Cushion to always keep in the bank (optional)</span><div class="prefix dollar" data-p="$"><input type="number" id="syCushion" value="${esc(state.cushion)}" placeholder="0"></div></label></div>
      <div class="warn" id="syMsg" hidden></div>
      <div class="sy-foot"><button type="button" class="btn" id="syCancel">Cancel</button><button type="button" class="btn primary" id="sySave">Save and re-sync</button></div>`;
    numify("#sync");
    $("sync").hidden = false; $("sync").scrollTop = 0; document.body.classList.add("sync-open");
  }
  function closeSync() { kpClose(); $("sync").hidden = true; $("syncBody").innerHTML = ""; document.body.classList.remove("sync-open"); }
  function saveSync() {
    const bank = $("syBank").value.trim();
    if (bank === "") { $("syMsg").hidden = false; $("syMsg").textContent = "Enter what's in your bank right now."; $("sync").scrollTop = 0; return; }
    const now = Date.now(), month = ymd(new Date()).slice(0, 7);
    state.balance = bank; state.balanceAt = now;
    state.card.balance = $("syCard").value.trim() === "" ? "0" : $("syCard").value.trim(); state.card.balanceAt = now;
    state.card.statement = $("syStmt").value.trim();
    state.cushion = $("syCushion").value.trim();
    document.querySelectorAll("#sync [data-sy-next]").forEach(i => { const inc = state.income.find(x => x.id === i.dataset.syNext); if (inc) inc.next = i.value; });
    document.querySelectorAll("#sync [data-sy-paid]").forEach(c => {
      const [list, id] = c.dataset.syPaid.split(":"), it = state[list].find(x => x.id === id);
      if (it) { it.paid = c.checked ? month : ""; it.unpaid = c.checked ? "" : month; }
    });
    document.querySelectorAll("#sync [data-sy-amt]").forEach(i => { const e = state.expenses.find(x => x.id === i.dataset.syAmt); if (e && i.value.trim() !== "") e.amount = i.value.trim(); });
    closeSync(); changed(); renderTabs(); renderPanel(); renderSummary();
  }

  function renderPanel() {
    const t = compute();
    $("panel").setAttribute("aria-labelledby", "tab-" + tab);
    $("panel").innerHTML = { spend: panelSpend, bills: panelBills, income: panelIncome, card: panelCard, debt: panelDebt }[tab](t);
    // Number fields use the on-screen keypad instead of the phone keyboard.
    numify("#panel");
  }
  // Update derived text without redrawing inputs (keeps typing focus).
  function renderDerived() {
    const t = compute();
    document.querySelectorAll(".row[data-list]").forEach(r => {
      const it = (state[r.dataset.list] || []).find(x => x.id === r.dataset.id);
      if (!it) return;
      const m = r.querySelector(".meta-l"); if (m) m.innerHTML = meta(r.dataset.list, it, t);
      r.querySelector(".rh").innerHTML = head(r.dataset.list, it, t);
    });
    if ($("cardOut")) $("cardOut").innerHTML = cardHTML(t);
    if ($("calcOut")) $("calcOut").innerHTML = calcHTML(t);
    if ($("chips")) $("chips").innerHTML = chipsHTML(t);
  }

  // ================= keypad =================
  const q = { cat: null, method: "card" };
  const PRESETS = [["Rent", "need", true, "bank"], ["Electric", "need", true, "bank", true], ["Water", "need", false, "bank", true], ["Internet", "need", true, "card"], ["Phone", "need", true, "card"],
    ["Car insurance", "need", true, "bank"], ["Streaming", "want", true, "card"], ["Music", "want", true, "card"], ["Gym", "want", true, "card"], ["Cloud storage", "want", true, "card"]];
  let kpInput = null, kpStr = "", kpFresh = true;
  function kpShow() { $("kpVal").textContent = (kpInput.closest(".dollar") ? "$" : "") + (kpStr || "0") + (kpInput.closest(".pct") ? "%" : ""); }
  function kpOpen(inp) {
    if (!inp || kpInput === inp) return;
    if (kpInput) kpInput.classList.remove("kp-active");
    kpInput = inp; kpStr = inp.value || ""; kpFresh = true;
    inp.classList.add("kp-active");
    const f = inp.closest(".field"), r = inp.closest(".row"), nm = r && r.querySelector('[data-k="name"]');
    $("kpLabel").textContent = (nm && nm.value ? nm.value + " · " : "") + (f ? f.querySelector("span").textContent : "Amount");
    $("kp").hidden = false; document.body.classList.add("kp-open"); kpShow();
    const box = inp.closest(".row, .quick") || inp; // keep the whole item, with its Delete button, above the keypad
    requestAnimationFrame(() => { try { box.scrollIntoView({ block: "start", behavior: "smooth" }); } catch (_) {} });
  }
  function kpClose() {
    if (!kpInput) return;
    kpInput.classList.remove("kp-active"); kpInput = null;
    $("kp").hidden = true; document.body.classList.remove("kp-open");
  }
  function kpKey(k) {
    if (!kpInput) return;
    if (k === "done") return kpClose();
    if (k === "clear") kpStr = "";
    else if (k === "back") kpStr = kpStr.slice(0, -1);
    else {
      if (kpFresh) kpStr = "";
      if (k === ".") { if (!kpStr.includes(".")) kpStr = (kpStr || "0") + "."; }
      else {
        const dot = kpStr.indexOf(".");
        if (dot >= 0) { if (kpStr.length - dot <= 2) kpStr += k.slice(0, 3 - (kpStr.length - dot)); }
        else if (kpStr.length + k.length <= 8) kpStr = (kpStr === "0" || kpStr === "") ? String(+k) : kpStr + k;
      }
    }
    kpFresh = false;
    kpInput.value = kpStr; kpShow();
    kpInput.dispatchEvent(new Event("input", { bubbles: true }));
  }
  document.addEventListener("focusin", e => {
    if (e.target.matches && e.target.matches("input[data-num]")) kpOpen(e.target);
    else if (kpInput && e.target.matches && e.target.matches("input, select")) kpClose();
  });
  document.addEventListener("keydown", e => {
    if (!kpInput || e.metaKey || e.ctrlKey) return;
    const k = /^[0-9.]$/.test(e.key) ? e.key : e.key === "Backspace" ? "back" : (e.key === "Enter" || e.key === "Escape") ? "done" : null;
    if (k) { e.preventDefault(); kpKey(k); }
  });

  // ================= events =================
  document.addEventListener("click", e => {
    const key = e.target.closest("[data-key]");
    if (key) { kpKey(key.dataset.key); return; }
    const num = e.target.closest("input[data-num]");
    if (num) { kpOpen(num); return; }
    if (kpInput && !e.target.closest("#kp")) kpClose();
    if (e.target.closest("[data-sync]")) { openSync(); return; }
    if (e.target.id === "syCancel") { closeSync(); return; }
    if (e.target.id === "sySave") { saveSync(); return; }
    const tog = e.target.closest("[data-toggle]");
    if (tog) { const id = tog.dataset.toggle; if (openRows.has(id)) openRows.delete(id); else openRows.add(id); renderPanel(); return; }
    const opt = e.target.closest("[data-q]");
    if (opt) {
      q[opt.dataset.q] = opt.dataset.v;
      opt.parentNode.querySelectorAll(".opt").forEach(b => b.setAttribute("aria-pressed", b === opt));
      return;
    }
    const pre = e.target.closest("[data-preset]");
    if (pre) {
      const p = PRESETS[+pre.dataset.preset], id = uid();
      state.expenses.push({ id, name: p[0], amount: "", freq: "monthly", kind: p[1], auto: p[2], pay: p[3], due: "", varies: !!p[4] }); openRows.add(id);
      changed(); renderPanel(); renderSummary();
      kpOpen(document.getElementById("expenses-amount-" + id));
      return;
    }
    const v = e.target.closest("[data-view]");
    if (v) { view = v.dataset.view; try { localStorage.setItem("monthly-budget-view", view); } catch (_) {} renderSummary(); return; }
    const tb = e.target.closest("[data-tab]");
    if (tb) { tab = tb.dataset.tab; renderTabs(); renderPanel(); return; }
    const del = e.target.closest("[data-del]");
    if (del) { const l = del.dataset.list; state[l] = state[l].filter(x => x.id !== del.dataset.del); changed(); renderPanel(); renderSummary(); return; }
    const dl = e.target.closest("[data-dellog]");
    if (dl) { state.log = state.log.filter(x => x.id !== dl.dataset.dellog); changed(); renderPanel(); renderSummary(); return; }
    const add = e.target.closest("[data-add]");
    if (add) {
      const l = add.dataset.add, id = uid();
      const fresh = {
        income: { id, name: "", amount: "", freq: "weekly" },
        expenses: { id, name: "", amount: "", freq: "monthly", kind: "need", auto: false, pay: "bank", due: "" },
        budgets: { id, name: "", amount: "", kind: "want" },
        debts: { id, name: "", balance: "", apr: "", payment: "", auto: true },
      }[l];
      state[l].push(fresh); openRows.add(id); changed(); renderPanel(); renderSummary();
      const inp = document.getElementById(`${l}-name-${id}`); if (inp) inp.focus();
      return;
    }
    if (e.target.id === "bkCopy") {
      const text = JSON.stringify(state);
      const manual = () => { $("bkBox").hidden = false; $("bkText").value = text; $("bkText").select(); $("bkMsg").textContent = "Couldn't copy automatically. Select all the text in the box and copy it."; };
      try { navigator.clipboard.writeText(text).then(() => { $("bkMsg").textContent = "Backup copied. Paste it into Notes to keep it."; }, manual); } catch (_) { manual(); }
      return;
    }
    if (e.target.id === "bkShow") { $("bkBox").hidden = false; $("bkText").value = ""; $("bkText").focus(); $("bkMsg").textContent = "Paste your backup into the box, then tap Replace."; return; }
    if (e.target.id === "bkRestore") {
      let s = null;
      try { s = migrate(JSON.parse($("bkText").value.trim())); } catch (_) {}
      if (!s) { $("bkMsg").textContent = "That doesn't look like a backup from this app. Paste the whole text and try again."; return; }
      state = s; state.isExample = false; openRows.clear(); save(); redraw();
      $("bkMsg").textContent = "Backup restored.";
      return;
    }
    if (e.target.id === "clearExamples") {
      const base = EXAMPLE();
      state = { v: 2, isExample: false, savingsPct: 10, savingsAuto: false, balance: "", cushion: "",
        income: [{ id: uid(), name: "Paycheck (take-home)", amount: "", freq: "weekly", next: "" }],
        expenses: [], budgets: base.budgets.map(b => ({ ...b, amount: "" })), debts: [],
        card: { name: "Credit card", limit: "", dueDay: "", balance: "" }, log: [], calc: base.calc };
      tab = "income"; changed(); renderTabs(); renderPanel(); renderSummary();
    }
  });

  function setField(target, value) {
    const r = target.closest(".row[data-list]");
    if (r && target.dataset.k) {
      const it = state[r.dataset.list].find(x => x.id === r.dataset.id);
      if (it) { it[target.dataset.k] = target.dataset.k === "paid" ? (value ? ymd(new Date()).slice(0, 7) : "") : value; return true; }
    }
    if (target.dataset.path) { const [a, b] = target.dataset.path.split("."); if (b === undefined) state[a] = value; else state[a][b] = value;
      if (target.dataset.path === "balance") state.balanceAt = Date.now();
      if (target.dataset.path === "card.balance") state.card.balanceAt = Date.now();
      return true; }
    return false;
  }

  document.addEventListener("input", e => {
    const tg = e.target;
    if (tg.id === "savePct") { state.savingsPct = +tg.value; changed(); renderSummary(); renderDerived(); return; }
    if (tg.closest("#quickForm")) return;
    if (tg.tagName === "SELECT" || tg.type === "checkbox") return; // handled on change
    if (setField(tg, tg.value)) { changed(); renderSummary(); renderDerived(); }
  });
  document.addEventListener("change", e => {
    const tg = e.target;
    if (tg.id === "saveAuto") { state.savingsAuto = tg.checked; changed(); renderSummary(); return; }
    if (tg.closest("#quickForm")) return;
    if (tg.tagName !== "SELECT" && tg.type !== "checkbox") return;
    if (setField(tg, tg.type === "checkbox" ? tg.checked : tg.value)) { changed(); renderPanel(); renderSummary(); }
  });
  document.addEventListener("submit", e => {
    if (e.target.id !== "quickForm") return;
    e.preventDefault();
    const amt = n($("qAmount").value);
    if (amt <= 0) { kpOpen($("qAmount")); return; }
    state.log.push({ id: uid(), at: Date.now(), date: $("qDate").value || ymd(new Date()), amount: amt, note: $("qNote").value.trim(), cat: q.cat || "", method: q.method });
    kpClose(); changed(); renderPanel(); renderSummary();
  });

  // ================= saving =================
  const LS_KEY = "monthly-budget-v1";
  let saveTimer = null;
  const setStatus = s => { $("status").textContent = s; };
  function changed() {
    if (state.isExample) state.isExample = false;
    clearTimeout(saveTimer); setStatus("Saving…");
    saveTimer = setTimeout(save, 400);
  }
  function save() {
    clearTimeout(saveTimer); saveTimer = null;
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); setStatus("Saved on this device"); }
    catch (_) { setStatus("Couldn't save. Turn off Private Browsing and reopen."); }
  }
  const redraw = () => { renderTabs(); renderPanel(); renderSummary(); };

  try { const raw = localStorage.getItem(LS_KEY); if (raw) { const s = migrate(JSON.parse(raw)); if (s) state = s; else localStorage.setItem(LS_KEY + "-unreadable", raw); } } catch (_) {}
  redraw();
  setStatus(state.isExample ? "Example budget" : "Saved on this device");
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (_) {}

  // Save right away when the app is closed; refresh the daily numbers when it's reopened.
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") { if (saveTimer) save(); }
    else if ($("sync").hidden) { renderSummary(); if (!kpInput && !document.activeElement.matches("input, select, textarea") && !($("bkBox") && !$("bkBox").hidden)) renderPanel(); }
  });
  window.addEventListener("pagehide", () => { if (saveTimer) save(); });
})();
</script>
</body>
</html>
